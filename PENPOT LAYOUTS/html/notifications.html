<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/PENPOT LAYOUTS/css/notifications.css">
<title>UkayFinds - Notifications</title>
</head>
<body>

<section id="notifications-view">
  <!-- HEADER — same structure/classes as find-a-store.html & community-feed.html -->
  <header class="app-header">
    <div class="brand-logo">UkayFinds</div>

    <nav class="app-nav">
      <a href="find-a-store.html" class="nav-link">Find A Store</a>
      <a href="community-feed.html" class="nav-link">Community Feed</a>
      <a href="#" class="nav-link active">Notifications</a>
    </nav>

    <div class="user-menu-container">
      <button id="user-avatar-btn" class="avatar-btn" aria-haspopup="true" aria-expanded="false">R</button>
      <div id="user-dropdown" class="user-dropdown">
        <div class="dropdown-header">
          <div class="dropdown-avatar">R</div>
          <div>
            <strong id="dropdown-name">Remi Findlay</strong>
            <small id="dropdown-email">remifinds@gmail.com</small>
          </div>
        </div>
        <hr>
        <ul class="dropdown-links">
          <li><a href="#"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg> Saved Spots</a></li>
          <li><a href="#"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12h8M8 8h8M8 16h5"/></svg> My Shared Hauls</a></li>
          <li><a href="#"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1z"/></svg> Account Settings</a></li>
        </ul>
        <hr>
        <a href="index.html" class="logout-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          Log Out
        </a>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="notif-main-container">
    <div class="notif-hero">
      <h2>Notifications</h2>
      <p>Stay updated on likes, comments and new ukay-ukay spots near you.</p>
    </div>

    <div class="notif-controls">
      <div class="filter-pills" id="filter-pills">
        <button type="button" class="pill active" data-filter="all">All</button>

        <div class="filter-dropdown">
          <button type="button" class="pill filter-dropdown-btn" id="filter-dropdown-btn">
            Filter by:
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="filter-dropdown-menu" id="filter-dropdown-menu">
            <button type="button" data-filter="comment">Comments</button>
            <button type="button" data-filter="like">Likes</button>
            <button type="button" data-filter="spot">New Spots</button>
          </div>
        </div>
      </div>

      <button type="button" id="mark-all-read-btn" class="mark-all-read-btn">Mark all as read</button>
    </div>

    <div class="notif-list" id="notif-list"><!-- populated by JS --></div>

    <p class="no-notifs hidden" id="no-notifs">Nothing here yet for this filter.</p>
  </main>
</section>

<script src="/PENPOT LAYOUTS/js/notifications.js"></script>
</body>
</html>
